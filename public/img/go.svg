<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="50" fill="#deb26a"/>
  <!-- grid lines -->
  <g stroke="#7a4e21" stroke-width="1.2">
    <line x1="30" y1="20" x2="30" y2="80"/><line x1="50" y1="20" x2="50" y2="80"/><line x1="70" y1="20" x2="70" y2="80"/>
    <line x1="20" y1="30" x2="80" y2="30"/><line x1="20" y1="50" x2="80" y2="50"/><line x1="20" y1="70" x2="80" y2="70"/>
  </g>
  <!-- black stone -->
  <circle cx="30" cy="50" r="9" fill="#1a1a1a"/>
  <circle cx="50" cy="30" r="9" fill="#1a1a1a"/>
  <!-- white stone -->
  <circle cx="50" cy="70" r="9" fill="#f0f0f0" stroke="#aaa" stroke-width=".8"/>
  <circle cx="70" cy="50" r="9" fill="#f0f0f0" stroke="#aaa" stroke-width=".8"/>
</svg>